  <meta charset="UTF-8" />

  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #6b7280;
      --card-bg: #ffffff;
      --card-border: rgba(17, 17, 17, 0.08);
      --shadow: 0 8px 30px rgba(0,0,0,0.04);
      --logo-height: 54px;
      --row-gap: 18px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 1440px;
      margin: 0 auto;
      padding: 40px 24px 56px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.05;
      letter-spacing: -0.03em;
      font-weight: 700;
    }

    .header p {
      margin: 0 auto;
      max-width: 760px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .carousel {
      display: grid;
      gap: var(--row-gap);
      position: relative;
    }

    .row {
      position: relative;
      overflow: hidden;
      width: 100%;
      mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
    }

    .track {
      width: max-content;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 10px 0;
      will-change: transform;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    .row[data-direction="left"] .track { animation-name: marquee-left; }
    .row[data-direction="right"] .track { animation-name: marquee-right; }

    .card {
      width: 168px;
      height: 96px;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      background: var(--card-bg);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      flex: 0 0 auto;
    }

    .card img {
      max-width: 100%;
      max-height: var(--logo-height);
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      filter: saturate(1);
    }

    @keyframes marquee-left {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    @keyframes marquee-right {
      from { transform: translateX(-50%); }
      to { transform: translateX(0); }
    }

    @media (max-width: 900px) {
      .wrap { padding: 28px 16px 36px; }
      .card { width: 140px; height: 84px; padding: 14px; border-radius: 14px; }
      :root { --logo-height: 46px; --row-gap: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .track { animation: none !important; }
      .row { overflow-x: auto; mask-image: none; -webkit-mask-image: none; }
    }
  </style>
</head>

    function splitIntoRows(items, rowCount) {
      const rows = Array.from({ length: rowCount }, () => []);
      items.forEach((item, index) => rows[index % rowCount].push(item));
      return rows;
    }

    function createCard(url) {
      const card = document.createElement('div');
      card.className = 'card';
      const img = document.createElement('img');
      img.src = url;
      img.alt = 'Organization logo';
      img.loading = 'lazy';
      img.decoding = 'async';
      img.onerror = () => { card.style.display = 'none'; };
      card.appendChild(img);
      return card;
    }

    const rows = splitIntoRows(logos, rowsCount);
    const durations = [42, 36, 40, 34];

    rows.forEach((rowLogos, index) => {
      const row = document.createElement('div');
      row.className = 'row';
      row.dataset.direction = index % 2 === 0 ? 'left' : 'right';

      const track = document.createElement('div');
      track.className = 'track';
      track.style.animationDuration = `${durations[index % durations.length]}s`;

      const doubled = rowLogos.concat(rowLogos);
      doubled.forEach(url => track.appendChild(createCard(url)));

      row.appendChild(track);
      carousel.appendChild(row);
    });
